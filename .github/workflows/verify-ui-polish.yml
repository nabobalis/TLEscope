name: Verify responsive UI polish

on:
  push:
    branches:
      - feature/multi-groundtracks-macos-app
    paths:
      - .github/workflows/verify-ui-polish.yml

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multi-groundtracks-macos-app
      - name: Prepare duplicate config defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/config.c')
          s = p.read_text()
          needle = '    config->show_2d_footprints = false;\n'
          if s.count(needle) != 2:
              raise SystemExit(f'unexpected default count: {s.count(needle)}')
          s = s.replace(needle, '    config->show_2d_footprints = false; /* prepared */\n    config->show_2d_track_legend = true;\n', 1)
          p.write_text(s)
          PY
      - name: Apply UI patch
        run: python3 .github/apply-ui-polish.py
      - name: Add wrapped error text helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ui.c')
          s = p.read_text()
          anchor = 'void DrawUIText(Font font, const char *text, float x, float y, float size, Color color) { DrawTextEx(font, text, (Vector2){x, y}, size, 1.0f, color); }\n'
          helper = r'''

static void DrawWrappedUIText(Font font, const char *text, Rectangle bounds, float size, Color color)
{
    if (!text || bounds.width <= 0 || bounds.height <= 0) return;
    char line[512];
    int len = 0;
    float y = bounds.y;
    float line_height = size + 3.0f;

    for (const char *p = text; ; p++)
    {
        char c = *p;
        bool flush = (c == '\n' || c == '\0');
        if (!flush && len < (int)sizeof(line) - 2)
        {
            line[len++] = c;
            line[len] = '\0';
            if (MeasureTextEx(font, line, size, 1.0f).x > bounds.width && len > 1)
            {
                char carry = line[--len];
                line[len] = '\0';
                if (y + size > bounds.y + bounds.height) return;
                DrawTextEx(font, line, (Vector2){bounds.x, y}, size, 1.0f, color);
                y += line_height;
                line[0] = carry;
                line[1] = '\0';
                len = 1;
            }
        }
        if (flush)
        {
            if (len > 0)
            {
                if (y + size > bounds.y + bounds.height) return;
                DrawTextEx(font, line, (Vector2){bounds.x, y}, size, 1.0f, color);
                y += line_height;
                len = 0;
                line[0] = '\0';
            }
            if (c == '\0') break;
        }
    }
}
'''
          if s.count(anchor) != 1:
              raise SystemExit('DrawUIText anchor not found')
          s = s.replace(anchor, anchor + helper, 1)
          old = '''        DrawTextRec(customFont, pull_error_detail[0] ? pull_error_detail : "Unknown download error",\n                    detailRec, 11.0f * dialog_scale, 1.0f, true, (Color){235, 110, 110, 255});\n'''
          new = '''        DrawWrappedUIText(customFont, pull_error_detail[0] ? pull_error_detail : "Unknown download error",\n                          detailRec, 11.0f * dialog_scale, (Color){235, 110, 110, 255});\n'''
          if s.count(old) != 1:
              raise SystemExit('DrawTextRec call not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Finalize config defaults
        run: sed -i 's/show_2d_footprints = false; \/\* prepared \*\//show_2d_footprints = false;/' src/config.c
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev libcurl4-openssl-dev
      - name: Build Linux
        run: make linux
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.h src/config.c src/ui.c src/main.c
          git commit -m "ui: improve TLE errors and responsive track legend"
          git pull --rebase origin feature/multi-groundtracks-macos-app
          git push origin HEAD:feature/multi-groundtracks-macos-app

  macos-intel:
    runs-on: macos-15-intel
    env:
      RAYLIB_VERSION: "5.5"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multi-groundtracks-macos-app
      - name: Prepare duplicate config defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/config.c')
          s = p.read_text()
          needle = '    config->show_2d_footprints = false;\n'
          if s.count(needle) != 2:
              raise SystemExit(f'unexpected default count: {s.count(needle)}')
          s = s.replace(needle, '    config->show_2d_footprints = false; /* prepared */\n    config->show_2d_track_legend = true;\n', 1)
          p.write_text(s)
          PY
      - name: Apply UI patch
        run: python3 .github/apply-ui-polish.py
      - name: Add wrapped error text helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ui.c')
          s = p.read_text()
          anchor = 'void DrawUIText(Font font, const char *text, float x, float y, float size, Color color) { DrawTextEx(font, text, (Vector2){x, y}, size, 1.0f, color); }\n'
          helper = r'''

static void DrawWrappedUIText(Font font, const char *text, Rectangle bounds, float size, Color color)
{
    if (!text || bounds.width <= 0 || bounds.height <= 0) return;
    char line[512];
    int len = 0;
    float y = bounds.y;
    float line_height = size + 3.0f;

    for (const char *p = text; ; p++)
    {
        char c = *p;
        bool flush = (c == '\n' || c == '\0');
        if (!flush && len < (int)sizeof(line) - 2)
        {
            line[len++] = c;
            line[len] = '\0';
            if (MeasureTextEx(font, line, size, 1.0f).x > bounds.width && len > 1)
            {
                char carry = line[--len];
                line[len] = '\0';
                if (y + size > bounds.y + bounds.height) return;
                DrawTextEx(font, line, (Vector2){bounds.x, y}, size, 1.0f, color);
                y += line_height;
                line[0] = carry;
                line[1] = '\0';
                len = 1;
            }
        }
        if (flush)
        {
            if (len > 0)
            {
                if (y + size > bounds.y + bounds.height) return;
                DrawTextEx(font, line, (Vector2){bounds.x, y}, size, 1.0f, color);
                y += line_height;
                len = 0;
                line[0] = '\0';
            }
            if (c == '\0') break;
        }
    }
}
'''
          if s.count(anchor) != 1:
              raise SystemExit('DrawUIText anchor not found')
          s = s.replace(anchor, anchor + helper, 1)
          old = '''        DrawTextRec(customFont, pull_error_detail[0] ? pull_error_detail : "Unknown download error",\n                    detailRec, 11.0f * dialog_scale, 1.0f, true, (Color){235, 110, 110, 255});\n'''
          new = '''        DrawWrappedUIText(customFont, pull_error_detail[0] ? pull_error_detail : "Unknown download error",\n                          detailRec, 11.0f * dialog_scale, (Color){235, 110, 110, 255});\n'''
          if s.count(old) != 1:
              raise SystemExit('DrawTextRec call not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Finalize config defaults
        run: sed -i '' 's/show_2d_footprints = false; \/\* prepared \*\//show_2d_footprints = false;/' src/config.c
      - name: Restore patched Raylib cache
        id: raylib-cache
        uses: actions/cache@v4
        with:
          path: .deps/raylib
          key: ${{ runner.os }}-${{ runner.arch }}-raylib-${{ env.RAYLIB_VERSION }}-macos11-glfw-mousefix-v1
      - name: Build patched static Raylib
        if: steps.raylib-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/raysan5/raylib/archive/refs/tags/${RAYLIB_VERSION}.tar.gz" -o raylib.tar.gz
          tar -xzf raylib.tar.gz
          python3 - <<'PY'
          from pathlib import Path
          p = Path("raylib-5.5/src/external/glfw/src/input.c")
          s = p.read_text()
          needle = "    assert(button <= GLFW_MOUSE_BUTTON_LAST);\n"
          guard = "    if (button < 0 || button > GLFW_MOUSE_BUTTON_LAST)\n        return;\n"
          if s.count(needle) != 1 or guard not in s:
              raise SystemExit("unexpected GLFW mouse-button guard")
          p.write_text(s.replace(needle, "", 1))
          PY
          make -C "raylib-${RAYLIB_VERSION}/src" \
            PLATFORM=PLATFORM_DESKTOP \
            RAYLIB_LIBTYPE=STATIC \
            CUSTOM_CFLAGS="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -DGL_SILENCE_DEPRECATION"
          mkdir -p .deps/raylib/include .deps/raylib/lib
          cp "raylib-${RAYLIB_VERSION}/src/raylib.h" "raylib-${RAYLIB_VERSION}/src/raymath.h" "raylib-${RAYLIB_VERSION}/src/rlgl.h" .deps/raylib/include/
          cp "raylib-${RAYLIB_VERSION}/src/libraylib.a" .deps/raylib/lib/
      - name: Build and verify Intel app
        run: |
          test -f .deps/raylib/lib/libraylib.a
          make app \
            RAYLIB_CFLAGS="-I$PWD/.deps/raylib/include" \
            RAYLIB_LIBS="$PWD/.deps/raylib/lib/libraylib.a" \
            MACOS_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET"
          file dist/TLEscope.app/Contents/MacOS/TLEscope | grep -q 'x86_64'
          codesign --verify --deep --strict dist/TLEscope.app
