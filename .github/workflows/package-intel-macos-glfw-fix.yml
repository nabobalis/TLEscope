name: Verify Intel macOS mouse input fix

on:
  push:
    branches:
      - feature/multi-groundtracks-macos-app
    paths:
      - .github/workflows/package-intel-macos-glfw-fix.yml

jobs:
  macos-intel:
    runs-on: macos-15-intel
    env:
      RAYLIB_VERSION: "5.5"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multi-groundtracks-macos-app

      - name: Build patched static Raylib
        run: |
          curl -fsSL "https://github.com/raysan5/raylib/archive/refs/tags/${RAYLIB_VERSION}.tar.gz" -o raylib.tar.gz
          tar -xzf raylib.tar.gz
          python3 - <<'PY'
          from pathlib import Path
          p = Path("raylib-5.5/src/external/glfw/src/input.c")
          s = p.read_text()
          needle = "    assert(button <= GLFW_MOUSE_BUTTON_LAST);\n"
          guard = "    if (button < 0 || button > GLFW_MOUSE_BUTTON_LAST)\n        return;\n"
          if s.count(needle) != 1:
              raise SystemExit("unexpected GLFW mouse-button assertion count")
          if guard not in s:
              raise SystemExit("expected GLFW mouse-button bounds guard not found")
          p.write_text(s.replace(needle, "", 1))
          PY
          make -C "raylib-${RAYLIB_VERSION}/src" \
            PLATFORM=PLATFORM_DESKTOP \
            RAYLIB_LIBTYPE=STATIC \
            CUSTOM_CFLAGS="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -DGL_SILENCE_DEPRECATION"
          mkdir -p .deps/raylib/include .deps/raylib/lib
          cp "raylib-${RAYLIB_VERSION}/src/raylib.h" \
             "raylib-${RAYLIB_VERSION}/src/raymath.h" \
             "raylib-${RAYLIB_VERSION}/src/rlgl.h" \
             .deps/raylib/include/
          cp "raylib-${RAYLIB_VERSION}/src/libraylib.a" .deps/raylib/lib/

      - name: Build and verify Intel app
        run: |
          make app \
            RAYLIB_CFLAGS="-I$PWD/.deps/raylib/include" \
            RAYLIB_LIBS="$PWD/.deps/raylib/lib/libraylib.a" \
            MACOS_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET}"
          file dist/TLEscope.app/Contents/MacOS/TLEscope | grep -q 'x86_64'
          if otool -L dist/TLEscope.app/Contents/MacOS/TLEscope | grep -E '/(opt/homebrew|usr/local)/'; then
            echo "Found a non-system runtime dependency in the app bundle"
            exit 1
          fi
          codesign --verify --deep --strict dist/TLEscope.app
          ditto -c -k --sequesterRsrc --keepParent dist/TLEscope.app TLEscope-macOS-Intel-glfw-fix.zip

      - name: Upload Intel macOS app
        uses: actions/upload-artifact@v4
        with:
          name: TLEscope-macOS-Intel-glfw-fix
          path: TLEscope-macOS-Intel-glfw-fix.zip
          retention-days: 14
