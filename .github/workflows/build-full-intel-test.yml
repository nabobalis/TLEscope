name: Build combined Intel macOS test app

on:
  push:
    branches: ["build/full-intel-test"]

permissions:
  contents: read

jobs:
  build:
    name: Intel macOS combined test
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Build portable application
        run: make macos

      - name: Build app bundle
        run: |
          ./macos_bundle.sh
          bash -n dist/TLEscope.app/Contents/MacOS/TLEscope
          test -x dist/TLEscope.app/Contents/MacOS/TLEscope
          test -x dist/TLEscope.app/Contents/MacOS/TLEscope.bin
          test -f dist/TLEscope.app/Contents/Resources/themes/default/theme.json
          test -f dist/TLEscope.app/Contents/Resources/themes/default/font.ttf
          plutil -lint dist/TLEscope.app/Contents/Info.plist

      - name: Verify Intel architecture
        run: |
          file dist/TLEscope.app/Contents/MacOS/TLEscope.bin
          file dist/TLEscope.app/Contents/MacOS/TLEscope.bin | grep -q "x86_64"

      - name: Package app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/TLEscope.app \
            dist/TLEscope-Combined-Test-macOS-Intel.app.zip
          unzip -l dist/TLEscope-Combined-Test-macOS-Intel.app.zip | grep -q "TLEscope.app/Contents/Resources/themes/default/font.ttf"
          shasum -a 256 dist/TLEscope-Combined-Test-macOS-Intel.app.zip

      - name: Upload app bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TLEscope-Combined-Test-macOS-Intel-App
          path: dist/TLEscope-Combined-Test-macOS-Intel.app.zip
          retention-days: 7
          if-no-files-found: error
