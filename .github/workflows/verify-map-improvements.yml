name: Verify 2D map improvements

on:
  push:
    branches:
      - tmp-map-improvements-verify7
    paths:
      - .github/workflows/verify-map-improvements.yml

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-map-improvements-verify7
      - name: Generate map detail data and patch source
        run: |
          curl -fsSL https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_110m_coastline.geojson -o /tmp/coast.geojson
          curl -fsSL https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_110m_admin_0_countries.geojson -o /tmp/countries.geojson
          python3 - <<'PYCODE'
          import base64, gzip
          exec(gzip.decompress(base64.b64decode("")))
          PYCODE
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev libcurl4-openssl-dev
      - name: Build Linux
        run: make linux
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.c src/types.h src/config.c src/ui.c src/map_detail_data.h
          git commit -m "perf: improve 2D map rendering and ground tracks"
          git push origin HEAD:tmp-map-improvements-verify7

  macos-intel:
    needs: linux
    runs-on: macos-15-intel
    env:
      RAYLIB_VERSION: "5.5"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-map-improvements-verify7
      - name: Restore patched Raylib cache
        id: raylib-cache
        uses: actions/cache@v4
        with:
          path: .deps/raylib
          key: ${{ runner.os }}-${{ runner.arch }}-raylib-${{ env.RAYLIB_VERSION }}-macos11-glfw-mousefix-v1
      - name: Build patched static Raylib on cache miss
        if: steps.raylib-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/raysan5/raylib/archive/refs/tags/${RAYLIB_VERSION}.tar.gz" -o raylib.tar.gz
          tar -xzf raylib.tar.gz
          python3 - <<'PY'
          from pathlib import Path
          p = Path("raylib-5.5/src/external/glfw/src/input.c")
          s = p.read_text()
          needle = "    assert(button <= GLFW_MOUSE_BUTTON_LAST);\n"
          guard = "    if (button < 0 || button > GLFW_MOUSE_BUTTON_LAST)\n        return;\n"
          if s.count(needle) != 1 or guard not in s:
              raise SystemExit("unexpected GLFW mouse-button guard")
          p.write_text(s.replace(needle, "", 1))
          PY
          make -C "raylib-${RAYLIB_VERSION}/src" PLATFORM=PLATFORM_DESKTOP RAYLIB_LIBTYPE=STATIC CUSTOM_CFLAGS="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -DGL_SILENCE_DEPRECATION"
          mkdir -p .deps/raylib/include .deps/raylib/lib
          cp "raylib-${RAYLIB_VERSION}/src/raylib.h" "raylib-${RAYLIB_VERSION}/src/raymath.h" "raylib-${RAYLIB_VERSION}/src/rlgl.h" .deps/raylib/include/
          cp "raylib-${RAYLIB_VERSION}/src/libraylib.a" .deps/raylib/lib/
      - name: Build and verify Intel app
        run: |
          test -f .deps/raylib/lib/libraylib.a
          make app RAYLIB_CFLAGS="-I$PWD/.deps/raylib/include" RAYLIB_LIBS="$PWD/.deps/raylib/lib/libraylib.a" MACOS_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET"
          file dist/TLEscope.app/Contents/MacOS/TLEscope | grep -q 'x86_64'
          if otool -L dist/TLEscope.app/Contents/MacOS/TLEscope | grep -E '/(opt/homebrew|usr/local)/'; then exit 1; fi
          codesign --verify --deep --strict dist/TLEscope.app
