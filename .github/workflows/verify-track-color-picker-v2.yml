name: Verify track color controls v2

on:
  push:
    branches:
      - feature/multi-groundtracks-macos-app
    paths:
      - .github/scripts/improve-track-colors-v2.py
      - .github/workflows/verify-track-color-picker-v2.yml

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multi-groundtracks-macos-app
          fetch-depth: 0
      - name: Apply color improvements
        run: python3 .github/scripts/improve-track-colors-v2.py
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev libcurl4-openssl-dev
      - name: Build Linux portable package
        run: make linux
      - name: Commit verified source changes
        run: |
          rm -f .github/scripts/improve-track-colors.py .github/scripts/improve-track-colors-v2.py
          rm -rf build bin dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config.c src/config.h src/ui.c .github/scripts/improve-track-colors.py .github/scripts/improve-track-colors-v2.py
          git commit -m "feat: improve mission track color controls"
          git push origin HEAD:feature/multi-groundtracks-macos-app

  macos-intel:
    runs-on: macos-15-intel
    env:
      RAYLIB_VERSION: "5.5"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multi-groundtracks-macos-app
      - name: Apply color improvements
        run: python3 .github/scripts/improve-track-colors-v2.py
      - name: Build static Raylib
        run: |
          curl -fsSL "https://github.com/raysan5/raylib/archive/refs/tags/${RAYLIB_VERSION}.tar.gz" -o raylib.tar.gz
          tar -xzf raylib.tar.gz
          make -C "raylib-${RAYLIB_VERSION}/src" PLATFORM=PLATFORM_DESKTOP RAYLIB_LIBTYPE=STATIC CUSTOM_CFLAGS="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -DGL_SILENCE_DEPRECATION"
          mkdir -p .deps/raylib/include .deps/raylib/lib
          cp "raylib-${RAYLIB_VERSION}/src/raylib.h" "raylib-${RAYLIB_VERSION}/src/raymath.h" "raylib-${RAYLIB_VERSION}/src/rlgl.h" .deps/raylib/include/
          cp "raylib-${RAYLIB_VERSION}/src/libraylib.a" .deps/raylib/lib/
      - name: Build and verify Intel app
        run: |
          make app RAYLIB_CFLAGS="-I$PWD/.deps/raylib/include" RAYLIB_LIBS="$PWD/.deps/raylib/lib/libraylib.a" MACOS_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET"
          file dist/TLEscope.app/Contents/MacOS/TLEscope | grep -q 'x86_64'
          codesign --verify --deep --strict dist/TLEscope.app
