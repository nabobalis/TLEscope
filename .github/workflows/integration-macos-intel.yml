name: Integration macOS Intel

on:
  push:
    branches:
      - integration/extremelywip-all-features
  workflow_dispatch:

jobs:
  macos-intel:
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare current macOS link rule
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Makefile")
          text = path.read_text()

          old_ldflags = "LDFLAGS_MACOS = $(RAYLIB_LIB) -lcurl -framework OpenGL -framework Cocoa -framework IOKit -framework CoreAudio -framework CoreVideo"
          new_ldflags = old_ldflags + " -framework QuartzCore"
          if old_ldflags not in text:
              raise SystemExit("unexpected macOS linker flags in Makefile")
          text = text.replace(old_ldflags, new_ldflags, 1)

          old_target = "bin/TLEscope-macos: raylib $(SRC) $(CJSON_SRC) | bin"
          new_target = "bin/TLEscope-macos: raylib $(SRC) $(IMGUI_SRC) $(RLIMGUI_SRC) $(CJSON_SRC) | bin"
          if old_target not in text:
              raise SystemExit("unexpected macOS target prerequisites in Makefile")
          text = text.replace(old_target, new_target, 1)

          old_link = "\t$(CC_MACOS) $(CXXFLAGS) $(RAYLIB_CFLAGS) -o $@ $^ $(LDFLAGS_MACOS)"
          fixed_link = "\t$(CC_MACOS) $(CXXFLAGS) $(RAYLIB_CFLAGS) -o $@ $(filter-out raylib,$^) $(LDFLAGS_MACOS)"
          if old_link in text:
              text = text.replace(old_link, fixed_link, 1)
          elif fixed_link not in text:
              raise SystemExit("unexpected macOS linker command in Makefile")

          path.write_text(text)
          PY

      - name: Build portable macOS binary
        run: make macos

      - name: Build app bundle
        run: |
          bash ./macos_bundle.sh
          chmod +x dist/TLEscope.app/Contents/MacOS/TLEscope
          chmod +x dist/TLEscope.app/Contents/MacOS/TLEscope.bin

      - name: Verify Intel architecture
        run: |
          file dist/TLEscope.app/Contents/MacOS/TLEscope.bin
          file dist/TLEscope.app/Contents/MacOS/TLEscope.bin | grep -q 'x86_64'

      - name: Verify runtime dependencies
        run: |
          otool -L dist/TLEscope.app/Contents/MacOS/TLEscope.bin
          if otool -L dist/TLEscope.app/Contents/MacOS/TLEscope.bin | grep -E '/opt/homebrew|/usr/local'; then
            echo 'Unexpected Homebrew runtime dependency in app binary' >&2
            exit 1
          fi

      - name: Ad-hoc sign and verify bundle
        run: |
          codesign --force --deep --sign - dist/TLEscope.app
          codesign --verify --deep --strict dist/TLEscope.app

      - name: Package app bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/TLEscope.app TLEscope-macOS-Intel.zip

      - name: Upload Intel app
        uses: actions/upload-artifact@v4
        with:
          name: TLEscope-integration-macOS-Intel
          path: TLEscope-macOS-Intel.zip
          retention-days: 14
